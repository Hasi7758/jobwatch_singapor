name: daily-jobwatch-sg

on:
  schedule:
    - cron: "40 22 * * *"   # UTC;新加坡时间次日 06:40
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: jobwatch
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 装依赖
        run: pip install requests pyyaml

      - name: 抓取 + 差分 + 生成报告
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set +e
          python jobwatch.py run > run.log 2>&1
          RC=$?
          set -e
          cat run.log
          exit $RC

      - name: 把结果存回仓库
        if: always()
        run: |
          git config user.name "jobwatch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "digest $(date -u '+%Y-%m-%d %H:%M') UTC" || echo "无变化,跳过提交"
          git push
